name: Manter a nuvem acordada

# O plano gratuito do Supabase pausa o projeto depois de uns dias com pouco uso.
# A cada 6 horas: grava no banco, lê o banco e passa pela autenticação.
# Se a nuvem não responder e houver o segredo SUPABASE_ACCESS_TOKEN no GitHub,
# o projeto é reativado sozinho. A execução falha (e o GitHub manda e-mail) quando
# a nuvem não responde, para ninguém ficar sem saber.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: https://pifuiczrytmizqxzygbi.supabase.co
      REF: pifuiczrytmizqxzygbi
      KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpZnVpY3pyeXRtaXpxeHp5Z2JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzM2MDQsImV4cCI6MjEwNjk0OTYwNH0.LcJfh9mGhspaUDIFN4u5mtvHJZX0zoDF9GpOCuQta3o
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Uso do banco
        id: uso
        run: |
          ok=1
          for f in manter_ativo; do
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/$f" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d '{}' || echo 000)
            echo "Gravação no banco: $code"; [ "$code" = "200" ] || ok=0
          done
          code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/escala_version" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d '{"p_codigo":"keepalive"}' || echo 000)
          echo "Leitura no banco: $code"; [ "$code" = "200" ] || ok=0
          auth=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$URL/auth/v1/health" -H "apikey: $KEY" || echo 000)
          echo "Autenticação: $auth"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Reativar o projeto se estiver pausado
        if: steps.uso.outputs.ok != '1'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::A nuvem não respondeu e não há SUPABASE_ACCESS_TOKEN para reativar sozinho. Reative em https://supabase.com/dashboard/project/$REF"
            exit 1
          fi
          status=$(curl -s -m 30 "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))")
          echo "Status do projeto: $status"
          if [ "$status" = "INACTIVE" ]; then
            curl -s -m 60 -X POST "https://api.supabase.com/v1/projects/$REF/restore" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -w '\nreativação: %{http_code}\n'
            echo "::warning::O projeto estava pausado e foi reativado. Volta em alguns minutos."
          fi
          exit 1
